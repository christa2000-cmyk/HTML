<!DOCTYPE html>
<html lang="en">


<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="HTML, CSS">
    <meta name="description" content="Car Rental in Grenada offering affordable, stylish, modern, SUVs serving the Maurice Bishop International Airport as a Airport Car Rental in Grenada, also serving the Hotels such as Calabash, Silversands, Royalton, Point Salines, Radissons, Coyaba, Airb&bs, True Blue ">
    <title>Make A Reservation</title>
    
    <style>
        :root{
          --primary-color: #c49c74;
          --text-dark: #333333;
          --text-light: #767268;
          --extra-light: #f0efef;
          --white: #ffffff;
          --max-width: 1200px;
        }
        
        .logo-img{
          height: 70px;
          width: 140px;
        }

        .section_header{
          background: linear-gradient(to bottom, rgba(0, 0, 0, 0.25),rgba(255, 255, 255,0));
          text-align: center;
          font-weight: 700;
          display:flex;
          gap: 20px;
          justify-content: center;
          
        }

        .header{
          background-image: url(https://images.unsplash.com/photo-1564501049412-61c2a3083791?q=80&w=1632&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
          background-position: top center;
          background-size:cover;
          background-repeat:no-repeat;
          min-height:125vh;
          display: grid;
          gap: 2rem;
        }


        .reserve { 
        font-size: 40px;    
        color: rgb(212, 20, 52);
        font-weight: 700;
        text-align: center;
        }

        .section_description{
          font-size: 1.7rem;
          font-weight: 500px;
          color: var(--white);
          text-align: center;
          line-height: 1.75rem;
        }
        .header_button{
          display:flex;
          align-items:center;
          justify-content:center;
          gap: 1rem;
        }

        .btn{
          padding: .75rem 1.5rem;
          outline: none;
          border: none;
          font-size: 1.50rem;
          font-family: lato;
          color: var(--white);
          background-color: var(--primary-color);
          border-radius: 5px;
          transition: 0.3s;
          cursor: pointer;
          margin-top: 20px;

          .btn:hover {background-color: crimson;
          }

        }

        *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
              
        }

        .header_container{
          max-width: var(--max-width);
          margin: auto;
          padding: 5rem 1rem;
        }

        .img{
          display: flex;
          width: 100%;
        }

        .header_container{
          display: grid;
          gap: 2rem;
        }

        .header_container{
          grid-template-columns: 4fr 2fr;
        }

        .booking {
          font-size: 4.5rem;
          font-weight: 500;
          color: white;
          text-align: left;
          font-size: 6rem;
          line-height: 6.5rem;

        .header_content{
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content:space-between;
        }

        .section_description{
          text-align: left;
          
          

        }

        .header_button{
          justify-content: flex-start;
         


        }
        }


        
    </style>

    <header class="section_header">
      <a href="index.html" class="logo-link">
            <img src="Images/car-cars-sedan-family-suv.webp" alt="Premium Eco Rentals Grenada car rental logo" class="logo-img"/>
        </a>  
        <h1 class="reserve">WELCOME TO RESERVATIONS</h1>
    </header>

    <header class="header">
            
     <div class="header_container" id="home">
        <h1 class="booking">Make your Hotel Stay an unforgettable experience</h1>
        <div class="header_content">
          <p class="section_description">
            Choose the right car to make your journey extraordinary and make memories. Now in 2026 hoteliers get to enjoy true customer service and appreciation. 
          </p>
          <div class="header_button">
            <button class="btn">Reserve a Car</button>
            <button class="btn">Sign up for voucher</button>
          </div>
        </div>  
    </div>
    </header>
        
    

    
  </body>
