    <style>
        :root{
          --primary-color: #c49c74;
          --text-dark: #333333;

          --extra-light: #f0efef;
          --white: #ffffff;
          --max-width: 1200px;
        }
        
        .logo-img{
          height: 70px;
          width: 140px;
        }

        .section_header{
          background: linear-gradient(to bottom, rgba(0, 0, 0, 0.25),rgba(255, 255, 255,0));
          text-align: center;
          font-weight: 700;
          display:flex;
          gap: 20px;
          justify-content: center;
          
        }

        .header{
          background-image: url(https://images.unsplash.com/photo-1564501049412-61c2a3083791?q=80&w=1632&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
          background-position: top center;
          background-size:cover;
          background-repeat:no-repeat;
          min-height:125vh;
          display: grid;
          gap: 2rem;
        }


        .reserve { 
        font-size: 40px;    
        color: rgb(212, 20, 52);
        font-weight: 700;
        text-align: center;
        }

        .section_description{
          font-size: 1.7rem;
          font-weight: 500px;
          color: var(--white);
          text-align: center;
          line-height: 1.75rem;
        }
        .header_button{
          display:flex;
          align-items:center;
          justify-content:center;
          gap: 1rem;
        }

        .btn{
          padding: .75rem 1.5rem;
          outline: none;
          border: none;
          font-size: 1.50rem;
          font-family: lato;
          color: var(--white);
          background-color: var(--primary-color);
          border-radius: 5px;
          transition: 0.3s;
          cursor: pointer;
          margin-top: 20px;

          .btn:hover {background-color: crimson;
          }

        }

        *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
              
        }

        .header_container{
          max-width: var(--max-width);
          margin: auto;
          padding: 5rem 1rem;
        }

        .img{
          display: flex;
          width: 100%;
        }

        .header_container{
          display: grid;
          gap: 2rem;
        }

        .header_container{
          grid-template-columns: 4fr 2fr;
        }

        .booking {
          font-size: 4.5rem;
          font-weight: 500;
          color: white;
          text-align: left;
          font-size: 6rem;
          line-height: 6.5rem;

        .header_content{
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content:space-between;
        }

        .section_description{
          text-align: left;
          
          

        }

        .header_button{
          justify-content: flex-start;
         


        }
        }

        .reservation-bar-container {
          width: 100%;
          max-width: 1100px;
          margin: 0 auto 3rem;
          display: flex;
          justify-content: center;
          position: relative;
          z-index: 5;
          padding: 0 1rem;
        }

        .reservation-bar {
          background: rgb(143, 138, 138);
          backdrop-filter: blur(4px);
          border-radius: 1rem;
          padding: 1.5rem;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 1.5rem;
          width: 100%;
          max-width: 980px;
          justify-content: center;
          box-shadow: 0 18px 40px rgba(0,0,0,0.24);
        }

        .reservation-field {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          min-width: 180px;
          flex: 1 1 180px;
        }

        .reservation-icon {
          width: 2.5rem;
          height: 2.5rem;
          background: rgba(189, 6, 46, 0.2);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .reservation-icon .icon {
          font-size: 1.25rem;
          color: rgb(189, 6, 46);
        }

        .reservation-label-input {
          display: flex;
          flex-direction: column;
        }

        .reservation-label-input label {
          color: white;
          font-size: 0.75rem;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          margin-bottom: 0.15rem;
          opacity: 0.7;
        }

        .reservation-label-input input {
          background: transparent;
          color: white;
          font-size: 1rem;
          font-weight: 500;
          border: none;
          border-bottom: 1px solid #D4A85380;
          padding: 0.2rem 0;
          outline: none;
        }

        .reservation-btn {
          background: rgb(189, 6, 46);
          color: #fff;
          font-weight: 400;
          font-size: 1rem;
          padding: 0.75rem 2rem;
          border: none;
          border-radius: 0.5rem;
          transition: background 0.2s;
          box-shadow: 0 2px 12px rgba(189, 6, 46, 0.5);
          cursor: pointer;
          white-space: nowrap;
        }

        .reservation-btn:hover {
          background: #FF4D6D;
        }

        @media (max-width: 768px) {
          .reservation-bar {
            padding: 1.25rem;
            gap: 1rem;
          }

          .reservation-field {
            min-width: 100%;
          }

          .reservation-btn {
            width: 100%;
            text-align: center;
          }
        }


        
    </style>
  
  </head>
