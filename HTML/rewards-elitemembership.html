<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Membership & Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(90deg, rgba(243, 229, 172, 0.8) 0%, rgba(255,245,238,0.6) 100%,), url('Images/EliteMembership.jpg') no-repeat center center fixed;
            color: #ffd700;
            font-family: 'Cormorant Garamond', 'Playfair Display', 'Georgia', serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .elite-container {
            background: linear-gradient(135deg, #f5d167 0%, #bfa14a 40%);
            border-radius: 1.5rem;
            box-shadow: 0 8px 74px 0 #bfa14a55;
            padding: 3.5rem 2.5rem 2.5rem 2.5rem;
            max-width: 480px;
            width: 90vw;
            text-align: center;
        }
        .elite-title {
            font-size: 2.7rem;
            font-weight: 900;
            color: #d39d20;
            background: linear-gradient(90deg, white 10%, #ddc53a 40%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.04em;
            margin-bottom: 1.7rem;
            text-shadow: 0 2px 18px #bfa14a55, 0 1px 8px #ffd70033;
        }
        .elite-statement {
            font-size: 1.25rem;
            color: #fffbe6;
            font-weight: 500;
            margin-bottom: 2.5rem;
            text-shadow: 0 2px 12px #e9c35357;
        }
        .vbtn1 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, #bfa14a 0%, #ddc53a 100%);
            color: #111;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.18rem;
            font-weight: 700;
            padding: 0.9rem 2.2rem;
            border: none;
            border-radius: 2.2rem;
            box-shadow: 0 2px 12px #bfa14a22;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.04em;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            margin-top: 1.2rem;
        }
        .vbtn1:hover {
            background: linear-gradient(90deg, #ffd700 0%, #bfa14a 100%);
            color: #000;
            box-shadow: 0 4px 24px #ffd70055;
        }
    </style>
</head>
<body>
    <div class="elite-container">
        <div class="elite-title">Elite Membership & Rewards</div>
        <div class="elite-statement">
            Gain access to Elite Membership by unlocking the experience elite package.
        </div>
        <a href="Drive-elite.html" class="vbtn1">Experience Elite</a>
    </div>
</body>
</html>
